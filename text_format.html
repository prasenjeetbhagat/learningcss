<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>textformat</title>
    <link href="css/style.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <h1 class="t_transform_uppercase">this is best day ,have a nice day</h1>
    <h2 class="t_transform_lowercase">this is best day ,have a nice day</h2>
    <h3 class="t_transform_capitalize">this is best day ,have a nice day</h3>
    <h4 class="t_transform_overflow">this is best day ,have a nice day</h4>
    <h1 class="t_text_decoration1">Welcome to Site1</h1>
    <h1 class="t_text_decoration2">Welcome to Site2</h1>
    <h1 class="t_text_decoration3">Welcome to Site3</h1>
    <h1 class="text_d">Prasenjeet</h1>
    <h1 class="text_align_r">Prasenjeet</h1>
    <h1 class="text_align_c">Prasenjeet</h1>
    <h1 class="text_align_l">Prasenjeet</h1>
    <h1 class="t_shadow1" text_align_c>Prasenjeet</h1>
    <h1 class="t_shadow2 text_align_c">Prasenjeet</h1>

</body>

</html>
